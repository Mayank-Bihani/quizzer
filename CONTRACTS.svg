<text x="30" y="42" font-size="25" fill="#142033" font-weight="700">Quizzer — V1 contracts and runtime flow</text>
<text x="30" y="69" font-size="13" fill="#526075" font-weight="400">2026-09-09 · Module types: src/core/contracts.ts · HTTP types: src/core/api.ts · No application handlers implemented</text>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#60718a"/></marker></defs>
<rect x="435" y="105" width="530" height="115" rx="12" fill="white" stroke="#7045a3" stroke-width="2"/>
<text x="453" y="134" font-size="19" fill="#7045a3" font-weight="700">SCHEDULER</text>
<text x="453" y="161" font-size="13" fill="#243247" font-weight="400">openRoom / closeQuiz / materializeTemplates</text>
<text x="453" y="183" font-size="13" fill="#243247" font-weight="400">computeWeeklyBoards / claimAndSend</text>
<text x="453" y="205" font-size="13" fill="#243247" font-weight="400">Orchestrates only; no D1 or KV writes</text>
<rect x="30" y="310" width="370" height="145" rx="12" fill="white" stroke="#26744e" stroke-width="2"/>
<text x="48" y="339" font-size="19" fill="#26744e" font-weight="700">BANK</text>
<text x="48" y="366" font-size="13" fill="#243247" font-weight="400">listUnused / claimUnused / getByIds</text>
<text x="48" y="388" font-size="13" fill="#243247" font-weight="400">QuestionFull includes solutions (admin/server)</text>
<text x="48" y="410" font-size="13" fill="#243247" font-weight="400">RC/LRDI shared material + group membership</text>
<text x="48" y="432" font-size="13" fill="#243247" font-weight="400">No quiz allowances or student clocks</text>
<rect x="455" y="310" width="490" height="145" rx="12" fill="white" stroke="#9c4b19" stroke-width="2"/>
<text x="473" y="339" font-size="19" fill="#9c4b19" font-weight="700">QUIZZING</text>
<text x="473" y="366" font-size="13" fill="#243247" font-weight="400">TimingPolicy -&gt; QuizUnitDefinition</text>
<text x="473" y="388" font-size="13" fill="#243247" font-weight="400">UnitContent + D1 clocks -&gt; ServedUnit</text>
<text x="473" y="410" font-size="13" fill="#243247" font-weight="400">SubmitUnitRequest -&gt; atomic closure + PlayState</text>
<text x="473" y="432" font-size="13" fill="#243247" font-weight="400">Final marks and reached-unit completion time</text>
<rect x="1000" y="310" width="370" height="145" rx="12" fill="white" stroke="#087d8c" stroke-width="2"/>
<text x="1018" y="339" font-size="19" fill="#087d8c" font-weight="700">TELEGRAM</text>
<text x="1018" y="366" font-size="13" fill="#243247" font-weight="400">claimAndSend(kind, target, payload)</text>
<text x="1018" y="388" font-size="13" fill="#243247" font-weight="400">QuizAnnouncePayload: unit timing summary</text>
<text x="1018" y="410" font-size="13" fill="#243247" font-weight="400">CloseResult / BoardSummary[] / cancellation</text>
<text x="1018" y="432" font-size="13" fill="#243247" font-weight="400">Outbound only; no gameplay dependency</text>
