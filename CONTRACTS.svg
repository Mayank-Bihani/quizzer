<text x="473" y="529" font-size="19" fill="#285fbd" font-weight="700">AUTH</text>
<text x="473" y="556" font-size="13" fill="#243247" font-weight="400">requireAuth / requireRole / currentUser</text>
<text x="473" y="578" font-size="13" fill="#243247" font-weight="400">Google identity, sessions, role guards</text>
<path d="M455,540 L240,455" stroke="#60718a" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M700,500 L700,455" stroke="#60718a" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="30" y="646" font-size="20" fill="#142033" font-weight="700">CLIENT ↔ QUIZZING: one active unit, one final batch</text>
<rect x="30" y="680" width="420" height="154" rx="12" fill="white" stroke="#526a8a" stroke-width="2"/>
<text x="48" y="709" font-size="19" fill="#526a8a" font-weight="700">1. Join / current</text>
<text x="48" y="736" font-size="13" fill="#243247" font-weight="400">QuizMeta + PlayState</text>
<text x="48" y="758" font-size="13" fill="#243247" font-weight="400">Entire active set; future units withheld</text>
<text x="48" y="780" font-size="13" fill="#243247" font-weight="400">Unit start/deadline persisted server-side</text>
<text x="48" y="802" font-size="13" fill="#243247" font-weight="400">Standalone is a one-question unit</text>
<rect x="490" y="680" width="420" height="154" rx="12" fill="white" stroke="#526a8a" stroke-width="2"/>
<text x="508" y="709" font-size="19" fill="#526a8a" font-weight="700">2. Local draft</text>
<text x="508" y="736" font-size="13" fill="#243247" font-weight="400">Back / Next / Skip / Clear</text>
<text x="508" y="758" font-size="13" fill="#243247" font-weight="400">Save edits in this browser only</text>
<text x="508" y="780" font-size="13" fill="#243247" font-weight="400">One shared timer; reading counts once</text>
<text x="508" y="802" font-size="13" fill="#243247" font-weight="400">Final unresolved response freezes batch</text>
<rect x="950" y="680" width="420" height="154" rx="12" fill="white" stroke="#526a8a" stroke-width="2"/>
<text x="968" y="709" font-size="19" fill="#526a8a" font-weight="700">3. Submit unit</text>
<text x="968" y="736" font-size="13" fill="#243247" font-weight="400">submissionId + reason + UnitAnswer[]</text>
<text x="968" y="758" font-size="13" fill="#243247" font-weight="400">Answers + closure + totals commit once</text>
<text x="968" y="780" font-size="13" fill="#243247" font-weight="400">Next unit or own final score returned</text>
<text x="968" y="802" font-size="13" fill="#243247" font-weight="400">Closed units cannot be reopened</text>
<path d="M450,750 L490,750" stroke="#60718a" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M910,750 L950,750" stroke="#60718a" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="30" y="870" width="1340" height="135" rx="12" fill="white" stroke="#526a8a" stroke-width="2"/>
<text x="48" y="899" font-size="19" fill="#526a8a" font-weight="700">Results and clock boundaries</text>
<text x="48" y="926" font-size="13" fill="#243247" font-weight="400">Personal overall deadline = join + SUM(unit allowances) + slack; admission cutoff is separate.</text>
<text x="48" y="948" font-size="13" fill="#243247" font-weight="400">Editing freezes at deadline; the frozen batch has 5 seconds to reach the server.</text>
<text x="48" y="970" font-size="13" fill="#243247" font-weight="400">Ranking: marks DESC, sum of reached-unit elapsed ASC. No per-question timing or V1 bonus.</text>
<text x="48" y="992" font-size="13" fill="#243247" font-weight="400">Rank/review unlock only after safe close and atomic board publication; review timing appears once per unit.</text>
</svg>
