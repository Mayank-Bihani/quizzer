<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Illustration A — Cut paper</title><link rel="stylesheet" href="../../styles.css"><style>*{box-sizing:border-box;min-width:0}html{height:100%;background:var(--amb-base);background-image:var(--amb-a);background-attachment:fixed}body{margin:0;padding:16px;width:700px;max-width:100%;min-height:100%;overflow-x:hidden;font:var(--type-body);color:var(--text-1);background:transparent}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.i{display:grid;gap:6px;justify-items:center;padding:10px;border-radius:var(--r-md);background:rgba(255,255,255,.6);border:1px solid var(--border-1)}.i img{width:100%;max-width:150px;height:auto;display:block}.c{font:var(--type-caption);color:var(--text-2)}</style></head><body><div class="g"><div class="i"><img src="../../assets/illustrations/paper-empty.svg" alt="Empty — no quizzes yet"><span class="c">Empty — no quizzes yet</span></div><div class="i"><img src="../../assets/illustrations/paper-waiting.svg" alt="Waiting — holding for deadline"><span class="c">Waiting — holding for deadline</span></div><div class="i"><img src="../../assets/illustrations/paper-finished.svg" alt="Finished — answers locked"><span class="c">Finished — answers locked</span></div><div class="i"><img src="../../assets/illustrations/paper-error.svg" alt="Error / room full"><span class="c">Error / room full</span></div></div></body></html>
