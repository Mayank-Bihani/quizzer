<!-- @dsCard group="Spacing" viewport="700x160" name="Radii scale" subtitle="Nesting rule: inner surface is exactly one step below its parent" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Radii scale</title><link rel="stylesheet" href="../../styles.css"><style>*{box-sizing:border-box;min-width:0}html{height:100%;background:var(--amb-base);background-image:var(--amb-a);background-attachment:fixed}body{margin:0;padding:16px;width:700px;max-width:100%;min-height:100%;overflow-x:hidden;font:var(--type-body);color:var(--text-1);background:transparent}.row{display:flex;gap:8px;align-items:stretch}.sw{flex:1;border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--border-1);background:#fff}.sw .c{height:44px}.sw .m{padding:5px 6px;display:grid;gap:1px}.sw .n{font:var(--fw-semibold) 10px/1.2 var(--font-num)}.sw .v{font:10px/1.2 var(--font-num);color:var(--text-3);text-transform:uppercase}.lab{font:var(--type-overline);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--text-3);margin-bottom:8px}code{font:var(--fw-medium) 11px/1.4 var(--font-num);color:var(--text-2);background:rgba(16,24,40,.05);padding:1px 4px;border-radius:3px}</style></head><body><div style="display:flex;gap:10px;flex-wrap:wrap"><div style="width:92px;height:72px;background:#fff;border:1px solid var(--border-2);display:grid;place-items:end center;padding:6px;font:10px/1 var(--font-num);color:var(--text-3);border-radius:var(--r-xs)"><span>xs · <span data-v="--r-xs"></span></span></div><div style="width:92px;height:72px;background:#fff;border:1px solid var(--border-2);display:grid;place-items:end center;padding:6px;font:10px/1 var(--font-num);color:var(--text-3);border-radius:var(--r-sm)"><span>sm · <span data-v="--r-sm"></span></span></div><div style="width:92px;height:72px;background:#fff;border:1px solid var(--border-2);display:grid;place-items:end center;padding:6px;font:10px/1 var(--font-num);color:var(--text-3);border-radius:var(--r-md)"><span>md · <span data-v="--r-md"></span></span></div><div style="width:92px;height:72px;background:#fff;border:1px solid var(--border-2);display:grid;place-items:end center;padding:6px;font:10px/1 var(--font-num);color:var(--text-3);border-radius:var(--r-lg)"><span>lg · <span data-v="--r-lg"></span></span></div><div style="width:92px;height:72px;background:#fff;border:1px solid var(--border-2);display:grid;place-items:end center;padding:6px;font:10px/1 var(--font-num);color:var(--text-3);border-radius:var(--r-xl)"><span>xl · <span data-v="--r-xl"></span></span></div><div style="width:92px;height:72px;background:#fff;border:1px solid var(--border-2);display:grid;place-items:end center;padding:6px;font:10px/1 var(--font-num);color:var(--text-3);border-radius:var(--r-2xl)"><span>2xl · <span data-v="--r-2xl"></span></span></div><div style="width:92px;height:72px;background:#fff;border:1px solid var(--border-2);display:grid;place-items:end center;padding:6px;font:10px/1 var(--font-num);color:var(--text-3);border-radius:var(--r-pill)"><span>pill · <span data-v="--r-pill"></span></span></div></div><script>const cs=getComputedStyle(document.documentElement);document.querySelectorAll('[data-v]').forEach(e=>e.textContent=cs.getPropertyValue(e.dataset.v).trim());</script></body></html>
