<!-- @dsCard group="Brand" viewport="700x190" name="Motion tokens" subtitle="Durations 80–640ms, four easings; timers are linear and reduced-motion drops to text+shape" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Motion tokens</title><link rel="stylesheet" href="../../styles.css"><style>*{box-sizing:border-box;min-width:0}html{height:100%;background:var(--amb-base);background-image:var(--amb-a);background-attachment:fixed}body{margin:0;padding:16px;width:700px;max-width:100%;min-height:100%;overflow-x:hidden;font:var(--type-body);color:var(--text-1);background:transparent}.row{display:flex;gap:8px;align-items:stretch}.sw{flex:1;border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--border-1);background:#fff}.sw .c{height:44px}.sw .m{padding:5px 6px;display:grid;gap:1px}.sw .n{font:var(--fw-semibold) 10px/1.2 var(--font-num)}.sw .v{font:10px/1.2 var(--font-num);color:var(--text-3);text-transform:uppercase}.lab{font:var(--type-overline);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--text-3);margin-bottom:8px}code{font:var(--fw-medium) 11px/1.4 var(--font-num);color:var(--text-2);background:rgba(16,24,40,.05);padding:1px 4px;border-radius:3px}</style></head><body><table style="width:100%;border-collapse:collapse;font:var(--type-body-sm)"><tbody><tr><td style="padding:5px 8px;border-bottom:1px solid var(--border-1)"><code>--dur-instant / --ease-standard</code></td><td style="padding:5px 8px;border-bottom:1px solid var(--border-1);color:var(--text-2)">Press feedback</td><td style="padding:5px 8px;border-bottom:1px solid var(--border-1);font-family:var(--font-num);font-size:11px;color:var(--text-3);text-align:right">80ms</td></tr><tr><td style="padding:5px 8px;border-bottom:1px solid var(--border-1)"><code>--dur-2 / --ease-standard</code></td><td style="padding:5px 8px;border-bottom:1px solid var(--border-1);color:var(--text-2)">Option select</td><td style="padding:5px 8px;border-bottom:1px solid var(--border-1);font-family:var(--font-num);font-size:11px;color:var(--text-3);text-align:right">180ms</td></tr><tr><td style="padding:5px 8px;border-bottom:1px solid var(--border-1)"><code>--dur-3 / --ease-out</code></td><td style="padding:5px 8px;border-bottom:1px solid var(--border-1);color:var(--text-2)">Question advance, sheet in</td><td style="padding:5px 8px;border-bottom:1px solid var(--border-1);font-family:var(--font-num);font-size:11px;color:var(--text-3);text-align:right">260ms</td></tr><tr><td style="padding:5px 8px;border-bottom:1px solid var(--border-1)"><code>--dur-4 / --ease-emphasis</code></td><td style="padding:5px 8px;border-bottom:1px solid var(--border-1);color:var(--text-2)">Answer lock — the only overshoot</td><td style="padding:5px 8px;border-bottom:1px solid var(--border-1);font-family:var(--font-num);font-size:11px;color:var(--text-3);text-align:right">420ms</td></tr><tr><td style="padding:5px 8px;border-bottom:1px solid var(--border-1)"><code>--ease-linear</code></td><td style="padding:5px 8px;border-bottom:1px solid var(--border-1);color:var(--text-2)">Timers — never eased, never CSS-driven</td><td style="padding:5px 8px;border-bottom:1px solid var(--border-1);font-family:var(--font-num);font-size:11px;color:var(--text-3);text-align:right">—</td></tr></tbody></table></body></html>
