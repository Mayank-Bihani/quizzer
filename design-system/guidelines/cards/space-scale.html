<!-- @dsCard group="Spacing" viewport="700x260" name="Spacing scale" subtitle="4px base with 2/6px optical half-steps; --sp-1 … --sp-13" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Spacing scale</title><link rel="stylesheet" href="../../styles.css"><style>*{box-sizing:border-box;min-width:0}html{height:100%;background:var(--amb-base);background-image:var(--amb-a);background-attachment:fixed}body{margin:0;padding:16px;width:700px;max-width:100%;min-height:100%;overflow-x:hidden;font:var(--type-body);color:var(--text-1);background:transparent}.row{display:flex;gap:8px;align-items:stretch}.sw{flex:1;border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--border-1);background:#fff}.sw .c{height:44px}.sw .m{padding:5px 6px;display:grid;gap:1px}.sw .n{font:var(--fw-semibold) 10px/1.2 var(--font-num)}.sw .v{font:10px/1.2 var(--font-num);color:var(--text-3);text-transform:uppercase}.lab{font:var(--type-overline);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--text-3);margin-bottom:8px}code{font:var(--fw-medium) 11px/1.4 var(--font-num);color:var(--text-2);background:rgba(16,24,40,.05);padding:1px 4px;border-radius:3px}</style></head><body><div><div style="display:flex;align-items:center;gap:12px;padding:3px 0"><span style="width:64px;font:11px/1 var(--font-num);color:var(--text-2)">sp-1</span><span style="width:44px;font:11px/1 var(--font-num);color:var(--text-3);text-align:right" data-v="--sp-1"></span><span style="height:12px;border-radius:3px;background:linear-gradient(90deg,var(--accent-400),var(--accent-500));width:var(--sp-1)"></span></div><div style="display:flex;align-items:center;gap:12px;padding:3px 0"><span style="width:64px;font:11px/1 var(--font-num);color:var(--text-2)">sp-2</span><span style="width:44px;font:11px/1 var(--font-num);color:var(--text-3);text-align:right" data-v="--sp-2"></span><span style="height:12px;border-radius:3px;background:linear-gradient(90deg,var(--accent-400),var(--accent-500));width:var(--sp-2)"></span></div><div style="display:flex;align-items:center;gap:12px;padding:3px 0"><span style="width:64px;font:11px/1 var(--font-num);color:var(--text-2)">sp-3</span><span style="width:44px;font:11px/1 var(--font-num);color:var(--text-3);text-align:right" data-v="--sp-3"></span><span style="height:12px;border-radius:3px;background:linear-gradient(90deg,var(--accent-400),var(--accent-500));width:var(--sp-3)"></span></div><div style="display:flex;align-items:center;gap:12px;padding:3px 0"><span style="width:64px;font:11px/1 var(--font-num);color:var(--text-2)">sp-4</span><span style="width:44px;font:11px/1 var(--font-num);color:var(--text-3);text-align:right" data-v="--sp-4"></span><span style="height:12px;border-radius:3px;background:linear-gradient(90deg,var(--accent-400),var(--accent-500));width:var(--sp-4)"></span></div><div style="display:flex;align-items:center;gap:12px;padding:3px 0"><span style="width:64px;font:11px/1 var(--font-num);color:var(--text-2)">sp-5</span><span style="width:44px;font:11px/1 var(--font-num);color:var(--text-3);text-align:right" data-v="--sp-5"></span><span style="height:12px;border-radius:3px;background:linear-gradient(90deg,var(--accent-400),var(--accent-500));width:var(--sp-5)"></span></div><div style="display:flex;align-items:center;gap:12px;padding:3px 0"><span style="width:64px;font:11px/1 var(--font-num);color:var(--text-2)">sp-6</span><span style="width:44px;font:11px/1 var(--font-num);color:var(--text-3);text-align:right" data-v="--sp-6"></span><span style="height:12px;border-radius:3px;background:linear-gradient(90deg,var(--accent-400),var(--accent-500));width:var(--sp-6)"></span></div><div style="display:flex;align-items:center;gap:12px;padding:3px 0"><span style="width:64px;font:11px/1 var(--font-num);color:var(--text-2)">sp-7</span><span style="width:44px;font:11px/1 var(--font-num);color:var(--text-3);text-align:right" data-v="--sp-7"></span><span style="height:12px;border-radius:3px;background:linear-gradient(90deg,var(--accent-400),var(--accent-500));width:var(--sp-7)"></span></div><div style="display:flex;align-items:center;gap:12px;padding:3p  style="display:flex;align-items:center;gap:12px;padding:3px 0"><span style="width:64px;font:11px/1 var(--font-num);color:var(--text-2)">sp-13</span><span style="width:44px;font:11px/1 var(--font-num);color:var(--text-3);text-align:right" data-v="--sp-13"></span><span style="height:12px;border-radius:3px;background:linear-gradient(90deg,var(--accent-400),var(--accent-500));width:var(--sp-13)"></span></div></div><script>const cs=getComputedStyle(document.documentElement);document.querySelectorAll('[data-v]').forEach(e=>e.textContent=cs.getPropertyValue(e.dataset.v).trim());</script></body></html>
