<!-- @dsCard group="Spacing" viewport="700x150" name="Touch targets" subtitle="--tap-min 44px everywhere; --tap-comfortable 52px for live-run primaries" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Touch targets</title><link rel="stylesheet" href="../../styles.css"><style>*{box-sizing:border-box;min-width:0}html{height:100%;background:var(--amb-base);background-image:var(--amb-a);background-attachment:fixed}body{margin:0;padding:16px;width:700px;max-width:100%;min-height:100%;overflow-x:hidden;font:var(--type-body);color:var(--text-1);background:transparent}.row{display:flex;gap:8px;align-items:stretch}.sw{flex:1;border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--border-1);background:#fff}.sw .c{height:44px}.sw .m{padding:5px 6px;display:grid;gap:1px}.sw .n{font:var(--fw-semibold) 10px/1.2 var(--font-num)}.sw .v{font:10px/1.2 var(--font-num);color:var(--text-3);text-transform:uppercase}.lab{font:var(--type-overline);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--text-3);margin-bottom:8px}code{font:var(--fw-medium) 11px/1.4 var(--font-num);color:var(--text-2);background:rgba(16,24,40,.05);padding:1px 4px;border-radius:3px}</style></head><body><div style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap"><button style="min-height:var(--tap-min);padding:0 20px;border:0;border-radius:var(--r-md);background:var(--action-primary-bg);color:#fff;font:var(--type-option)">44px · standard</button><button style="min-height:var(--tap-comfortable);padding:0 24px;border:0;border-radius:var(--r-md);background:var(--action-primary-bg);color:#fff;font:var(--type-option)">52px · submit &amp; lock</button><button style="width:var(--tap-min);height:var(--tap-min);border:1px solid var(--border-2);border-radius:var(--r-md);background:var(--action-secondary-bg);font:var(--type-option)">A</button></div><div style="margin-top:10px;font:var(--type-caption);color:var(--text-3)">Gutters: <code>--gutter-mobile</code> 16px · <code>--gutter-desktop</code> 24px</div></body></html>
