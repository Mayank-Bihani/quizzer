<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals" subtitle="Cool neutral ramp --n-0 … --n-950; text never pure black" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Neutrals</title><link rel="stylesheet" href="../../styles.css"><style>*{box-sizing:border-box;min-width:0}html{height:100%;background:var(--amb-base);background-image:var(--amb-a);background-attachment:fixed}body{margin:0;padding:16px;width:700px;max-width:100%;min-height:100%;overflow-x:hidden;font:var(--type-body);color:var(--text-1);background:transparent}.row{display:flex;gap:8px;align-items:stretch}.sw{flex:1;border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--border-1);background:#fff}.sw .c{height:44px}.sw .m{padding:5px 6px;display:grid;gap:1px}.sw .n{font:var(--fw-semibold) 10px/1.2 var(--font-num)}.sw .v{font:10px/1.2 var(--font-num);color:var(--text-3);text-transform:uppercase}.lab{font:var(--type-overline);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--text-3);margin-bottom:8px}code{font:var(--fw-medium) 11px/1.4 var(--font-num);color:var(--text-2);background:rgba(16,24,40,.05);padding:1px 4px;border-radius:3px}</style></head><body><div class="row"><div class="sw"><div class="c" style="background:var(--n-0)"></div><div class="m"><div class="n">n-0</div><div class="v" data-v="--n-0"></div></div></div><div class="sw"><div class="c" style="background:var(--n-50)"></div><div class="m"><div class="n">n-50</div><div class="v" data-v="--n-50"></div></div></div><div class="sw"><div class="c" style="background:var(--n-100)"></div><div class="m"><div class="n">n-100</div><div class="v" data-v="--n-100"></div></div></div><div class="sw"><div class="c" style="background:var(--n-200)"></div><div class="m"><div class="n">n-200</div><div class="v" data-v="--n-200"></div></div></div><div class="sw"><div class="c" style="background:var(--n-300)"></div><div class="m"><div class="n">n-300</div><div class="v" data-v="--n-300"></div></div></div><div class="sw"><div class="c" style="background:var(--n-400)"></div><div class="m"><div class="n">n-400</div><div class="v" data-v="--n-400"></div></div></div><div class="sw"><div class="c" style="background:var(--n-500)"></div><div class="m"><div class="n">n-500</div><div class="v" data-v="--n-500"></div></div></div><div class="sw"><div class="c" style="background:var(--n-600)"></div><div class="m"><div class="n">n-600</div><div class="v" data-v="--n-600"></div></div></div><div class="sw"><div class="c" style="background:var(--n-700)"></div><div class="m"><div class="n">n-700</div><div class="v" data-v="--n-700"></div></div></div><div class="sw"><div class="c" style="background:var(--n-800)"></div><div class="m"><div class="n">n-800</div><div class="v" data-v="--n-800"></div></div></div><div class="sw"><div class="c" style="background:var(--n-900)"></div><div class="m"><div class="n">n-900</div><div class="v" data-v="--n-900"></div></div></div><div class="sw"><div class="c" style="background:var(--n-950)"></div><div class="m"><div class="n">n-950</div><div class="v" data-v="--n-950"></div></div></div></div><script>const cs=getComputedStyle(document.documentElement);document.querySelectorAll('[data-v]').forEach(e=>e.textContent=cs.getPropertyValue(e.dataset.v).trim());</script></body></html>
