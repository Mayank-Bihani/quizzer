<!-- @dsCard group="Colors" viewport="700x180" name="Semantic ramps" subtitle="success / warning / danger / info — three steps each (50 / 500 / 700)" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Semantic ramps</title><link rel="stylesheet" href="../../styles.css"><style>*{box-sizing:border-box;min-width:0}html{height:100%;background:var(--amb-base);background-image:var(--amb-a);background-attachment:fixed}body{margin:0;padding:16px;width:700px;max-width:100%;min-height:100%;overflow-x:hidden;font:var(--type-body);color:var(--text-1);background:transparent}.row{display:flex;gap:8px;align-items:stretch}.sw{flex:1;border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--border-1);background:#fff}.sw .c{height:44px}.sw .m{padding:5px 6px;display:grid;gap:1px}.sw .n{font:var(--fw-semibold) 10px/1.2 var(--font-num)}.sw .v{font:10px/1.2 var(--font-num);color:var(--text-3);text-transform:uppercase}.lab{font:var(--type-overline);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--text-3);margin-bottom:8px}code{font:var(--fw-medium) 11px/1.4 var(--font-num);color:var(--text-2);background:rgba(16,24,40,.05);padding:1px 4px;border-radius:3px}</style></head><body><div class="row" style="margin-bottom:8px"><div class="sw"><div class="c" style="background:var(--success-50)"></div><div class="m"><div class="n">success-50</div><div class="v" data-v="--success-50"></div></div></div><div class="sw"><div class="c" style="background:var(--success-500)"></div><div class="m"><div class="n">success-500</div><div class="v" data-v="--success-500"></div></div></div><div class="sw"><div class="c" style="background:var(--success-700)"></div><div class="m"><div class="n">success-700</div><div class="v" data-v="--success-700"></div></div></div><div class="sw"><div class="c" style="background:var(--warning-50)"></div><div class="m"><div class="n">warning-50</div><div class="v" data-v="--warning-50"></div></div></div><div class="sw"><div class="c" style="background:var(--warning-500)"></div><div class="m"><div class="n">warning-500</div><div class="v" data-v="--warning-500"></div></div></div><div class="sw"><div class="c" style="background:var(--warning-700)"></div><div class="m"><div class="n">warning-700</div><div class="v" data-v="--warning-700"></div></div></div></div>
<div class="row"><div class="sw"><div class="c" style="background:var(--danger-50)"></div><div class="m"><div class="n">danger-50</div><div class="v" data-v="--danger-50"></div></div></div><div class="sw"><div class="c" style="background:var(--danger-500)"></div><div class="m"><div class="n">danger-500</div><div class="v" data-v="--danger-500"></div></div></div><div class="sw"><div class="c" style="background:var(--danger-700)"></div><div class="m"><div class="n">danger-700</div><div class="v" data-v="--danger-700"></div></div></div><div class="sw"><div class="c" style="background:var(--info-50)"></div><div class="m"><div class="n">info-50</div><div class="v" data-v="--info-50"></div></div></div><div class="sw"><div class="c" style="background:var(--info-500)"></div><div class="m"><div class="n">info-500</div><div class="v" data-v="--info-500"></div></div></div><div class="sw"><div class="c" style="background:var(--info-700)"></div><div class="m"><div class="n">info-700</div><div class="v" data-v="--info-700"></div></div></div></div><script>const cs=getComputedStyle(document.documentElement);document.querySelectorAll('[data-v]').forEach(e=>e.textContent=cs.getPropertyValue(e.dataset.v).trim());</script></body></html>
