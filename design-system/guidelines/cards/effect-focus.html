<!-- @dsCard group="Brand" viewport="700x150" name="Focus rings" subtitle="2px white spacer + 2px accent; darkened on glass so it survives the blur" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Focus rings</title><link rel="stylesheet" href="../../styles.css"><style>*{box-sizing:border-box;min-width:0}html{height:100%;background:var(--amb-base);background-image:var(--amb-a);background-attachment:fixed}body{margin:0;padding:16px;width:700px;max-width:100%;min-height:100%;overflow-x:hidden;font:var(--type-body);color:var(--text-1);background:transparent}.row{display:flex;gap:8px;align-items:stretch}.sw{flex:1;border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--border-1);background:#fff}.sw .c{height:44px}.sw .m{padding:5px 6px;display:grid;gap:1px}.sw .n{font:var(--fw-semibold) 10px/1.2 var(--font-num)}.sw .v{font:10px/1.2 var(--font-num);color:var(--text-3);text-transform:uppercase}.lab{font:var(--type-overline);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--text-3);margin-bottom:8px}code{font:var(--fw-medium) 11px/1.4 var(--font-num);color:var(--text-2);background:rgba(16,24,40,.05);padding:1px 4px;border-radius:3px}</style></head><body><div style="display:flex;gap:16px;flex-wrap:wrap;align-items:center"><button style="min-height:var(--tap-min);padding:0 18px;border:0;border-radius:var(--r-md);background:var(--action-primary-bg);color:#fff;font:var(--type-option);box-shadow:var(--focus-ring)">--focus-ring</button><span style="padding:10px;border-radius:var(--r-md);background-image:radial-gradient(60% 100% at 30% 30%,rgba(169,119,44,.45),transparent 70%),linear-gradient(120deg,#F1E6D2,#F3E4DD)"><button style="min-height:var(--tap-min);padding:0 18px;border:1px solid var(--action-secondary-border);border-radius:var(--r-md);background:var(--action-secondary-bg);color:var(--text-1);font:var(--type-option);box-shadow:var(--focus-ring-on-glass)">--focus-ring-on-glass</button></span><button style="min-height:var(--tap-min);padding:0 18px;border:0;border-radius:var(--r-md);background:var(--action-danger-bg);color:#fff;font:var(--type-option);box-shadow:var(--focus-ring-danger)">--focus-ring-danger</button></div></body></html>
