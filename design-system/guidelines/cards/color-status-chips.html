<!-- @dsCard group="Colors" viewport="700x130" name="Status chips" subtitle="tint + border + ink, always paired with a glyph — never colour alone" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Status chips</title><link rel="stylesheet" href="../../styles.css"><style>*{box-sizing:border-box;min-width:0}html{height:100%;background:var(--amb-base);background-image:var(--amb-a);background-attachment:fixed}body{margin:0;padding:16px;width:700px;max-width:100%;min-height:100%;overflow-x:hidden;font:var(--type-body);color:var(--text-1);background:transparent}.row{display:flex;gap:8px;align-items:stretch}.sw{flex:1;border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--border-1);background:#fff}.sw .c{height:44px}.sw .m{padding:5px 6px;display:grid;gap:1px}.sw .n{font:var(--fw-semibold) 10px/1.2 var(--font-num)}.sw .v{font:10px/1.2 var(--font-num);color:var(--text-3);text-transform:uppercase}.lab{font:var(--type-overline);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--text-3);margin-bottom:8px}code{font:var(--fw-medium) 11px/1.4 var(--font-num);color:var(--text-2);background:rgba(16,24,40,.05);padding:1px 4px;border-radius:3px}</style></head><body><div style="display:flex;gap:8px;flex-wrap:wrap"><span style="display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:var(--r-pill);font:var(--type-label);color:var(--status-danger-fg);background:var(--status-danger-bg);border:1px solid var(--status-danger-border)"><span aria-hidden="true">●</span>Live</span><span style="display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:var(--r-pill);font:var(--type-label);color:var(--status-success-fg);background:var(--status-success-bg);border:1px solid var(--status-success-border)"><span aria-hidden="true">▲</span>Open</span><span style="display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:var(--r-pill);font:var(--type-label);color:var(--status-info-fg);background:var(--status-info-bg);border:1px solid var(--status-info-border)"><span aria-hidden="true">◇</span>Scheduled</span><span style="display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:var(--r-pill);font:var(--type-label);color:var(--status-neutral-fg);background:var(--status-neutral-bg);border:1px solid var(--status-neutral-border)"><span aria-hidden="true">○</span>Draft</span><span style="display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:var(--r-pill);font:var(--type-label);color:var(--status-warning-fg);background:var(--status-warning-bg);border:1px solid var(--status-warning-border)"><span aria-hidden="true">◆</span>Closing soon</span></div>
<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><code>--status-*-fg</code><code>--status-*-bg</code><code>--status-*-border</code></div></body></html>
