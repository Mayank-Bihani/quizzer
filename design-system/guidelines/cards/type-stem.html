<!-- @dsCard group="Type" viewport="700x180" name="Question stem + LaTeX" subtitle="--type-stem 16/1.6 at 375px; math falls back to Source Serif italic pre-KaTeX" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Question stem + LaTeX</title><link rel="stylesheet" href="../../styles.css"><style>*{box-sizing:border-box;min-width:0}html{height:100%;background:var(--amb-base);background-image:var(--amb-a);background-attachment:fixed}body{margin:0;padding:16px;width:700px;max-width:100%;min-height:100%;overflow-x:hidden;font:var(--type-body);color:var(--text-1);background:transparent}.row{display:flex;gap:8px;align-items:stretch}.sw{flex:1;border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--border-1);background:#fff}.sw .c{height:44px}.sw .m{padding:5px 6px;display:grid;gap:1px}.sw .n{font:var(--fw-semibold) 10px/1.2 var(--font-num)}.sw .v{font:10px/1.2 var(--font-num);color:var(--text-3);text-transform:uppercase}.lab{font:var(--type-overline);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--text-3);margin-bottom:8px}code{font:var(--fw-medium) 11px/1.4 var(--font-num);color:var(--text-2);background:rgba(16,24,40,.05);padding:1px 4px;border-radius:3px}</style></head><body><div style="max-width:375px;font:var(--type-stem)">If <span style="font-family:var(--font-math);font-style:italic">x<sup style="font-style:normal;font-size:.7em">2</sup> − 5x + 6 = 0</span> and <span style="font-family:var(--font-math);font-style:italic">x &gt; 2</span>, what is the value of <span style="font-family:var(--font-math);font-style:italic">x<sup style="font-style:normal;font-size:.7em">3</sup> − 8</span>?<span style="display:block;text-align:center;font-family:var(--font-math);font-style:italic;font-size:1.15em;margin-top:12px;padding:8px;border-radius:var(--r-sm);background:rgba(16,24,40,.035)">∑<sub>i=1</sub><sup>n</sup> (2i − 1) = n<sup>2</sup></span></div></body></html>
