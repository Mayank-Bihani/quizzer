<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Accent blue</title><link rel="stylesheet" href="../../styles.css"><style>*{box-sizing:border-box;min-width:0}html{height:100%;background:var(--amb-base);background-image:var(--amb-a);background-attachment:fixed}body{margin:0;padding:16px;width:700px;max-width:100%;min-height:100%;overflow-x:hidden;font:var(--type-body);color:var(--text-1);background:transparent}.row{display:flex;gap:8px;align-items:stretch}.sw{flex:1;border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--border-1);background:#fff}.sw .c{height:44px}.sw .m{padding:5px 6px;display:grid;gap:1px}.sw .n{font:var(--fw-semibold) 10px/1.2 var(--font-num)}.sw .v{font:10px/1.2 var(--font-num);color:var(--text-3);text-transform:uppercase}.lab{font:var(--type-overline);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--text-3);margin-bottom:8px}code{font:var(--fw-medium) 11px/1.4 var(--font-num);color:var(--text-2);background:rgba(16,24,40,.05);padding:1px 4px;border-radius:3px}</style></head><body><div class="row"><div class="sw"><div class="c" style="background:var(--accent-50)"></div><div class="m"><div class="n">accent-50</div><div class="v" data-v="--accent-50"></div></div></div><div class="sw"><div class="c" style="background:var(--accent-100)"></div><div class="m"><div class="n">accent-100</div><div class="v" data-v="--accent-100"></div></div></div><div class="sw"><div class="c" style="background:var(--accent-200)"></div><div class="m"><div class="n">accent-200</div><div class="v" data-v="--accent-200"></div></div></div><div class="sw"><div class="c" style="background:var(--accent-300)"></div><div class="m"><div class="n">accent-300</div><div class="v" data-v="--accent-300"></div></div></div><div class="sw"><div class="c" style="background:var(--accent-400)"></div><div class="m"><div class="n">accent-400</div><div class="v" data-v="--accent-400"></div></div></div><div class="sw"><div class="c" style="background:var(--accent-500)"></div><div class="m"><div class="n">accent-500</div><div class="v" data-v="--accent-500"></div></div></div><div class="sw"><div class="c" style="background:var(--accent-600)"></div><div class="m"><div class="n">accent-600</div><div class="v" data-v="--accent-600"></div></div></div><div class="sw"><div class="c" style="background:var(--accent-700)"></div><div class="m"><div class="n">accent-700</div><div class="v" data-v="--accent-700"></div></div></div><div class="sw"><div class="c" style="background:var(--accent-800)"></div><div class="m"><div class="n">accent-800</div><div class="v" data-v="--accent-800"></div></div></div><div class="sw"><div class="c" style="background:var(--accent-900)"></div><div class="m"><div class="n">accent-900</div><div class="v" data-v="--accent-900"></div></div></div></div><script>const cs=getComputedStyle(document.documentElement);document.querySelectorAll('[data-v]').forEach(e=>e.textContent=cs.getPropertyValue(e.dataset.v).trim());</script></body></html>
