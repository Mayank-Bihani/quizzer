<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Elevation</title><link rel="stylesheet" href="../../styles.css"><style>*{box-sizing:border-box;min-width:0}html{height:100%;background:var(--amb-base);background-image:var(--amb-a);background-attachment:fixed}body{margin:0;padding:16px;width:700px;max-width:100%;min-height:100%;overflow-x:hidden;font:var(--type-body);color:var(--text-1);background:transparent}.row{display:flex;gap:8px;align-items:stretch}.sw{flex:1;border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--border-1);background:#fff}.sw .c{height:44px}.sw .m{padding:5px 6px;display:grid;gap:1px}.sw .n{font:var(--fw-semibold) 10px/1.2 var(--font-num)}.sw .v{font:10px/1.2 var(--font-num);color:var(--text-3);text-transform:uppercase}.lab{font:var(--type-overline);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--text-3);margin-bottom:8px}code{font:var(--fw-medium) 11px/1.4 var(--font-num);color:var(--text-2);background:rgba(16,24,40,.05);padding:1px 4px;border-radius:3px}</style></head><body><div style="display:flex;gap:16px;flex-wrap:wrap"><div style="width:140px;height:76px;background:#fff;border-radius:var(--r-md);display:grid;place-items:center;font:10px/1 var(--font-num);color:var(--text-3);box-shadow:var(--elev-1)">elev-1</div><div style="width:140px;height:76px;background:#fff;border-radius:var(--r-md);display:grid;place-items:center;font:10px/1 var(--font-num);color:var(--text-3);box-shadow:var(--elev-2)">elev-2</div><div style="width:140px;height:76px;background:#fff;border-radius:var(--r-md);display:grid;place-items:center;font:10px/1 var(--font-num);color:var(--text-3);box-shadow:var(--elev-3)">elev-3</div><div style="width:140px;height:76px;background:#fff;border-radius:var(--r-md);display:grid;place-items:center;font:10px/1 var(--font-num);color:var(--text-3);box-shadow:var(--elev-4)">elev-4</div></div></body></html>
