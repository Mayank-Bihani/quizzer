<!-- @dsCard group="Colors" viewport="700x160" name="Sections A — Reading Room" subtitle="Warm academic mid-tones: oxblood / ink green / tobacco / warm taupe, solid + on glass" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Sections A — Reading Room</title><link rel="stylesheet" href="../../styles.css"><style>*{box-sizing:border-box;min-width:0}html{height:100%;background:var(--amb-base);background-image:var(--amb-a);background-attachment:fixed}body{margin:0;padding:16px;width:700px;max-width:100%;min-height:100%;overflow-x:hidden;font:var(--type-body);color:var(--text-1);background:transparent}.row{display:flex;gap:8px;align-items:stretch}.sw{flex:1;border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--border-1);background:#fff}.sw .c{height:44px}.sw .m{padding:5px 6px;display:grid;gap:1px}.sw .n{font:var(--fw-semibold) 10px/1.2 var(--font-num)}.sw .v{font:10px/1.2 var(--font-num);color:var(--text-3);text-transform:uppercase}.lab{font:var(--type-overline);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--text-3);margin-bottom:8px}code{font:var(--fw-medium) 11px/1.4 var(--font-num);color:var(--text-2);background:rgba(16,24,40,.05);padding:1px 4px;border-radius:3px}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px"><div style="border-radius:var(--r-md);padding:10px;min-height:64px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;background:var(--sec-verbal-a)"><span style="font:var(--type-overline);letter-spacing:var(--ls-caps);text-transform:uppercase;opacity:.9">Verbal</span><span style="font:var(--fw-semibold) 11px/1 var(--font-num)" data-v="--sec-verbal-a"></span></div><div style="border-radius:var(--r-md);padding:10px;min-height:64px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;background:var(--sec-quant-a)"><span style="font:var(--type-overline);letter-spacing:var(--ls-caps);text-transform:uppercase;opacity:.9">Quant</span><span style="font:var(--fw-semibold) 11px/1 var(--font-num)" data-v="--sec-quant-a"></span></div><div style="border-radius:var(--r-md);padding:10px;min-height:64px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;background:var(--sec-lr-a)"><span style="font:var(--type-overline);letter-spacing:var(--ls-caps);text-transform:uppercase;opacity:.9">LR</span><span style="font:var(--fw-semibold) 11px/1 var(--font-num)" data-v="--sec-lr-a"></span></div><div style="border-radius:var(--r-md);padding:10px;min-height:64px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;background:var(--sec-overall-a)"><span style="font:var(--type-overline);letter-spacing:var(--ls-caps);text-transform:uppercase;opacity:.9">Overall</span><span style="font:var(--fw-semibold) 11px/1 var(--font-num)" data-v="--sec-overall-a"></span></div></div>
<div style="margin-top:10px;display:flex;gap:8px;padding:10px;border-radius:var(--r-md);background-image:radial-gradient(30% 60% at 20% 30%,rgba(169,119,44,.45),transparent 70%),radial-gradient(34% 60% at 80% 40%,rgba(138,59,52,.4),transparent 70%),linear-gradient(120deg,#F1E6D2,#F3E4DD)"><span style="display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:var(--r-pill);font:var(--type-label);background:var(--glass-a-bg);backdrop-filter:blur(var(--glass-a-blur)) saturate(var(--glass-a-sat));border:var(--glass-a-border)"><span style="width:8px;height:8px;border-radius:50%;background:var(--sec-verbal-a)"></span>Verbal</span><span style="display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:var(--r-pill);font:var(--type-label);background:var(--glass-a-bg);backdrop-filter:blur(var(--glass-a-blur)) saturate(var(--glass-a-sat));border:var(--glass-a-border)"><span style="width:8px;height:8px;border-radius:50%;background:var(--sec-quant-a)"></span>Quant</span><span style="display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:var(--r-pill);font:var(--type-label);background:var(--glass-a-bg);backdrop-filter:blur(var(--glass-a-blur)) saturate(var(--glass-a-sat));border:var(--glass-a-border)"><span style="width:8px;height:8px;border-radius:50%;background:var(--sec-lr-a)"></span>LR</span><span style="display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:var(--r-pill);font:var(--type-label);background:var(--glass-a-bg);backdrop-filter:blur(var(--glass-a-blur)) saturate(var(--glass-a-sat));border:var(--glass-a-border)"><span style="width:8px;height:8px;border-radius:50%;background:var(--sec-overall-a)"></span>Overall</span></div><script>const cs=getComputedStyle(document.documentElement);document.querySelectorAll('[data-v]').forEach(e=>e.textContent=cs.getPropertyValue(e.dataset.v).trim());</script></body></html>
