<!-- @dsCard group="Type" viewport="700x140" name="Labels, captions, overline" subtitle="--type-label / --type-caption / --type-overline — the 11–13px band" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Labels, captions, overline</title><link rel="stylesheet" href="../../styles.css"><style>*{box-sizing:border-box;min-width:0}html{height:100%;background:var(--amb-base);background-image:var(--amb-a);background-attachment:fixed}body{margin:0;padding:16px;width:700px;max-width:100%;min-height:100%;overflow-x:hidden;font:var(--type-body);color:var(--text-1);background:transparent}.row{display:flex;gap:8px;align-items:stretch}.sw{flex:1;border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--border-1);background:#fff}.sw .c{height:44px}.sw .m{padding:5px 6px;display:grid;gap:1px}.sw .n{font:var(--fw-semibold) 10px/1.2 var(--font-num)}.sw .v{font:10px/1.2 var(--font-num);color:var(--text-3);text-transform:uppercase}.lab{font:var(--type-overline);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--text-3);margin-bottom:8px}code{font:var(--fw-medium) 11px/1.4 var(--font-num);color:var(--text-2);background:rgba(16,24,40,.05);padding:1px 4px;border-radius:3px}</style></head><body><div style="display:grid;gap:8px"><div style="font:var(--type-overline);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--text-3)">Seconds per question</div><div style="font:var(--type-label)">Grace window <span style="color:var(--text-3);font-weight:400">(full speed bonus)</span></div><div style="font:var(--type-body-sm);color:var(--text-2)">Answer within the grace window to keep the full bonus.</div><div style="font:var(--type-caption);color:var(--text-3)">Closes 14 Sep, 9:30 PM IST</div></div></body></html>
