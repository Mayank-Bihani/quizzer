<!-- @dsCard group="Type" viewport="700x160" name="Tabular numerals" subtitle="--font-num + --numeric-features: every changing number is tabular lining" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Tabular numerals</title><link rel="stylesheet" href="../../styles.css"><style>*{box-sizing:border-box;min-width:0}html{height:100%;background:var(--amb-base);background-image:var(--amb-a);background-attachment:fixed}body{margin:0;padding:16px;width:700px;max-width:100%;min-height:100%;overflow-x:hidden;font:var(--type-body);color:var(--text-1);background:transparent}.row{display:flex;gap:8px;align-items:stretch}.sw{flex:1;border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--border-1);background:#fff}.sw .c{height:44px}.sw .m{padding:5px 6px;display:grid;gap:1px}.sw .n{font:var(--fw-semibold) 10px/1.2 var(--font-num)}.sw .v{font:10px/1.2 var(--font-num);color:var(--text-3);text-transform:uppercase}.lab{font:var(--type-overline);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--text-3);margin-bottom:8px}code{font:var(--fw-medium) 11px/1.4 var(--font-num);color:var(--text-2);background:rgba(16,24,40,.05);padding:1px 4px;border-radius:3px}</style></head><body><div style="display:flex;gap:28px;align-items:flex-end;flex-wrap:wrap"><div><div class="lab">Score</div><div style="font:var(--type-numeric-lg);font-variant-numeric:var(--numeric-features)">38.5</div></div><div><div class="lab">Rank</div><div style="font:var(--type-numeric);font-variant-numeric:var(--numeric-features)">04 / 96</div></div><div><div class="lab">Per-question clock</div><div style="font:var(--type-timer);font-variant-numeric:var(--numeric-features)">00:27</div></div><div><div class="lab">Window deadline</div><div style="font:var(--type-timer);font-variant-numeric:var(--numeric-features)">1:42:08</div></div><div><div class="lab">Negative marking</div><div style="font:var(--type-numeric);font-variant-numeric:var(--numeric-features);color:var(--danger-700)">−1</div></div></div></body></html>
