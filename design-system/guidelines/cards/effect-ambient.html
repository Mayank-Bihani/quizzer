<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Ambient backdrops A / B / C</title><link rel="stylesheet" href="../../styles.css"><style>*{box-sizing:border-box;min-width:0}html{height:100%;background:var(--amb-base);background-image:var(--amb-a);background-attachment:fixed}body{margin:0;padding:16px;width:700px;max-width:100%;min-height:100%;overflow-x:hidden;font:var(--type-body);color:var(--text-1);background:transparent}.row{display:flex;gap:8px;align-items:stretch}.sw{flex:1;border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--border-1);background:#fff}.sw .c{height:44px}.sw .m{padding:5px 6px;display:grid;gap:1px}.sw .n{font:var(--fw-semibold) 10px/1.2 var(--font-num)}.sw .v{font:10px/1.2 var(--font-num);color:var(--text-3);text-transform:uppercase}.lab{font:var(--type-overline);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--text-3);margin-bottom:8px}code{font:var(--fw-medium) 11px/1.4 var(--font-num);color:var(--text-2);background:rgba(16,24,40,.05);padding:1px 4px;border-radius:3px}</style></head><body><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px"><div><div class="lab">--amb-a</div><div style="height:120px;border-radius:var(--r-md);border:1px solid var(--border-1);position:relative;overflow:hidden;display:grid;place-items:center;background-image:var(--amb-a)"><span style="position:absolute;inset:0;background-image:var(--amb-noise);opacity:var(--amb-noise-opacity)"></span><span style="position:relative;padding:8px 12px;border-radius:var(--r-md);font:var(--type-label);background:var(--glass-a-bg);backdrop-filter:blur(var(--glass-a-blur));border:var(--glass-a-border);box-shadow:var(--glass-a-shadow)">Q7 of 20</span></div></div><div><div class="lab">--amb-b</div><div style="height:120px;border-radius:var(--r-md);border:1px solid var(--border-1);position:relative;overflow:hidden;display:grid;place-items:center;background-image:var(--amb-b)"><span style="position:absolute;inset:0;background-image:var(--amb-noise);opacity:var(--amb-noise-opacity)"></span><span style="position:relative;padding:8px 12px;border-radius:var(--r-md);font:var(--type-label);background:var(--glass-a-bg);backdrop-filter:blur(var(--glass-a-blur));border:var(--glass-a-border);box-shadow:var(--glass-a-shadow)">Q7 of 20</span></div></div><div><div class="lab">--amb-c</div><div style="height:120px;border-radius:var(--r-md);border:1px solid var(--border-1);position:relative;overflow:hidden;display:grid;place-items:center;background-image:var(--amb-c)"><span style="position:absolute;inset:0;background-image:var(--amb-noise);opacity:var(--amb-noise-opacity)"></span><span style="position:relative;padding:8px 12px;border-radius:var(--r-md);font:var(--type-label);background:var(--glass-a-bg);backdrop-filter:blur(var(--glass-a-blur));border:var(--glass-a-border);box-shadow:var(--glass-a-shadow)">Q7 of 20</span></div></div></div></body></html>
